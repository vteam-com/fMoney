  <linearGradient id="warningNodeGradient" x1="20%" y1="0%" x2="80%" y2="100%">
    <stop offset="0%" stop-color="#fff6e8" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#f2a23a" stop-opacity="0.45"/>
