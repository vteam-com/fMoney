name: Flutter Desktop Build

# A push to main that changes the version in pubspec.yaml builds the desktop apps and
# publishes them as the GitHub release "v<version>"; pushes that keep an already released
# version stop after reading it. The installed apps compare that tag with their own
# version to offer updates.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, so two pushes never publish the same release at once
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.50.0"
  NODE_VERSION: "current"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Number of version releases kept on GitHub; older ones are deleted
  RELEASES_TO_KEEP: 3

jobs:
  version:
    name: Read Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new_version: ${{ steps.released.outputs.new_version }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION_RAW=$(awk -F': *' '/^version:/{print $2; exit}' pubspec.yaml | tr -d '"' | xargs)
          echo "version=${VERSION_RAW%%+*}" >> "$GITHUB_OUTPUT"

      # A version with a release has shipped: nothing to build. A version without one
      # (just bumped, or its last run failed) is built and released.
      - name: Check whether this version is released
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "${TAG} is already released; skipping the builds."
            echo "new_version=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_version=true" >> "$GITHUB_OUTPUT"
          fi

      # The app compares this generated version with the release tag to offer updates;
      # a stale one would offer the same update again after every install.
      - name: Check the app reports the same version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -q "version = '${VERSION}';" lib/helpers/generated_app_version_data.dart; then
            echo "::error file=lib/helpers/generated_app_version_data.dart::Not at version ${VERSION}; run tool/check.sh and commit the result."
            exit 1
          fi

  build-windows:
    name: Build Windows
    needs: version
    if: needs.version.outputs.new_version == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows

      - name: Create Windows ZIP
        run: |
          cd build/windows/x64/runner/Release
          7z a -tzip ../../../../../mymoney-app-windows.zip .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mymoney-app-windows
          path: mymoney-app-windows.zip
          retention-days: 1

  build-linux:
    name: Build Linux
    needs: version
    if: needs.version.outputs.new_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies for Linux Build
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux App
        run: flutter build linux

      - name: Create Linux ZIP
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../mymoney-app-linux.tar.gz .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mymoney-app-linux
          path: mymoney-app-linux.tar.gz
          retention-days: 1

  build-macos:
    name: Build macOS
    needs: version
    if: needs.version.outputs.new_version == 'true'
    runs-on: macos-latest
    env:
      # The app bundle the macOS steps sign, notarize and zip
      MACOS_APP: build/macos/Build/Products/Release/money.app
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos

      # Signs with the Developer ID certificate, inside out (each framework before the app
      # holding it), with the hardened runtime and secure timestamp notarization requires. The
      # app takes Release.entitlements again: the build's own signature added get-task-allow,
      # which notarization refuses. The secrets are listed in the README's "Signing the macOS
      # build".
      - name: Sign macOS App
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE" || -z "$CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Set the MACOS_CERTIFICATE and MACOS_CERTIFICATE_PASSWORD secrets: see the README's \"Signing the macOS build\""
            exit 1
          fi

          # A keychain of its own, gone with the runner, that never locks
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          base64 --decode <<<"$CERTIFICATE" >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" |
            awk '/"Developer ID Application: / { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_CERTIFICATE holds no valid Developer ID Application certificate"
            exit 1
          fi

          find "$MACOS_APP/Contents/Frameworks" -depth \
            \( -name '*.framework' -o -name '*.dylib' \) -print0 |
          while IFS= read -r -d '' code; do
            codesign --force --timestamp --options runtime --sign "$identity" "$code"
          done
          codesign --force --timestamp --options runtime --sign "$identity" \
            --entitlements macos/Runner/Release.entitlements "$MACOS_APP"
          codesign --verify --strict --deep --verbose=2 "$MACOS_APP"

      # Apple's notary service scans the signed app; the ticket stapled to it lets Gatekeeper
      # open it, even offline, as any app from the Internet. `notarytool submit --wait` can end
      # well on a rejected app, so the status decides, and Apple's log of a rejection says what
      # to fix.
      - name: Notarize macOS App
        shell: bash
        timeout-minutes: 60
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -z "$API_KEY" || -z "$API_KEY_ID" || -z "$API_ISSUER_ID" ]]; then
            echo "::error::Set the APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER_ID secrets: see the README's \"Signing the macOS build\""
            exit 1
          fi

          printf '%s\n' "$API_KEY" >"$RUNNER_TEMP/api_key.p8"
          auth=(--key "$RUNNER_TEMP/api_key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          submission="$RUNNER_TEMP/notarize.zip"
          result="$RUNNER_TEMP/notarization.json"
          ditto -c -k --keepParent "$MACOS_APP" "$submission"
          xcrun notarytool submit "$submission" "${auth[@]}" --wait \
            --output-format json >"$result" || true
          cat "$result"
          if [[ "$(jq -r '.status // empty' "$result" || true)" != "Accepted" ]]; then
            id="$(jq -r '.id // empty' "$result" || true)"
            [[ -z "$id" ]] || xcrun notarytool log "$id" "${auth[@]}"
            echo "::error::Apple did not notarize the app; its log above says why"
            exit 1
          fi

          xcrun stapler staple "$MACOS_APP"
          spctl --assess --type execute --verbose=2 "$MACOS_APP"

      # ditto keeps the framework symlinks the code signature needs; leaving out
      # resource forks and extended attributes keeps "._*" files out of the bundle
      # when the app extracts its own updates.
      - name: Create macOS ZIP
        run: ditto -c -k --norsrc --noextattr --noacl --keepParent "$MACOS_APP" mymoney-app-macos.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: mymoney-app-macos
          path: mymoney-app-macos.zip
          retention-days: 1

  create-release:
    name: Create Release
    needs: [ version, build-windows, build-linux, build-macos ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Write release notes
        run: |
          # This version's section of CHANGELOG.md, without its heading
          awk -v heading="## [version ${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > changes.md

          cat > release_notes.md << EOF
          ## fMoney ${VERSION}
          $(cat changes.md)

          ### Downloads
          - **Windows**: mymoney-app-windows.zip
          - **Linux**: mymoney-app-linux.tar.gz
          - **macOS**: mymoney-app-macos.zip

          ### Installation
          1. Download the appropriate file for your platform
          2. Extract the archive
          3. Run the executable

          The desktop app checks for a newer release at launch and offers to install it.

          ### Requirements
          - Windows 10+ (64-bit)
          - Linux with GTK3 support
          - macOS 12+ (Intel & Apple silicon)

          Built from commit: ${GITHUB_SHA}
          EOF

      - name: Create the release
        run: |
          gh release create "$TAG" \
            artifacts/mymoney-app-windows.zip \
            artifacts/mymoney-app-linux.tar.gz \
            artifacts/mymoney-app-macos.zip \
            --title "fMoney ${VERSION}" \
            --notes-file release_notes.md \
            --target "$GITHUB_SHA"

  cleanup-old-releases:
    name: Cleanup Old Releases
    needs: create-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Keeps the RELEASES_TO_KEEP highest versions and deletes every other release,
      # including the old timestamp-named ones. Git tags are left in place.
      - name: Keep only the latest releases
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' > releases.txt
          { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' releases.txt || true; } | sort -V -r | sed -n "1,${RELEASES_TO_KEEP}p" > keep.txt
          if [ ! -s keep.txt ]; then
            echo "::error::No version release found; nothing deleted."
            exit 1
          fi
          echo "Keeping: $(tr '\n' ' ' < keep.txt)"
          for OLD_TAG in $(grep -v -x -F -f keep.txt releases.txt || true); do
            echo "Deleting release ${OLD_TAG}"
            gh release delete "$OLD_TAG" --yes
          done

      - name: Cleanup old workflow runs
        uses: actions/github-script@v8
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'builds.yml',
              per_page: 50,
            });

            // Keep only the latest 10 successful runs
            const successfulRuns = runs.workflow_runs.filter(run => run.conclusion === 'success');
            const runsToDelete = successfulRuns.slice(10);

            console.log(`Found ${successfulRuns.length} successful runs, deleting ${runsToDelete.length} old runs`);

            for (const run of runsToDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                console.log(`✅ Deleted run: ${run.id} (${run.created_at})`);
              } catch (error) {
                console.log(`❌ Failed to delete run ${run.id}: ${error.message}`);
              }
            }
